    <!-- MediaPipe Face Landmarker for Web (JavaScript) integrated directly into HTML -->
    <script type="module">
      async function setupMediaPipeFaceLandmarker() {
        try {
          const cdnUrl = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';
          const tasksVision = await import(/* @vite-ignore */ cdnUrl);
          window.FaceLandmarker = tasksVision.FaceLandmarker;
          window.FilesetResolver = tasksVision.FilesetResolver;
          window.dispatchEvent(new CustomEvent('mediapipe-face-landmarker-ready', { detail: tasksVision }));
          console.log('[MediaPipe Face Landmarker] Loaded successfully in HTML via CDN');
        } catch (err) {
          console.warn('[MediaPipe Face Landmarker] HTML module load warning:', err);
        }
      }
      setupMediaPipeFaceLandmarker();
    </script>
